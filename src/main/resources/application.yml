spring:
  application:
    name: kaspitracker

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:KaspiTracker}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway manages the schema — no auto DDL
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    username: ${APP_USERNAME:admin}
    # Password MUST be a BCrypt hash. 
    # Default is hash for "changeme" ($2a$10$pl5W3xJJpejkcFZ2DEaZ6.hPWk.z36LjORBmTv8jL4fUr5.lEOKf6).
    # Overwrite this in production by setting the APP_PASSWORD environment variable with your own BCrypt hash!
    password: ${APP_PASSWORD:$2a$10$pl5W3xJJpejkcFZ2DEaZ6.hPWk.z36LjORBmTv8jL4fUr5.lEOKf6}
    baseline-on-migrate: true   # Safe first run against existing (empty) DB
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax
logging:
  level:
    com.sultan.kaspitracker: DEBUG
    org.flywaydb: INFO
